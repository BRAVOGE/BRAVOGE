<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-labelledby="title description">
  <title id="title">Learn, build, refine, repeat</title>
  <desc id="description">A decorative grid illustrating steady learning and building habits, not actual GitHub contribution data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07111f"/>
      <stop offset="1" stop-color="#102840"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="190" rx="22" fill="url(#bg)"/>
  <text x="44" y="58" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">Small steps. Meaningful progress.</text>
  <text x="44" y="88" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">A creative reminder, not live contribution data.</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2" fill="#bae6fd">
    <text x="44" y="139">LEARN</text>
    <text x="179" y="139">BUILD</text>
    <text x="314" y="139">REFINE</text>
    <text x="449" y="139">REPEAT</text>
  </g>
